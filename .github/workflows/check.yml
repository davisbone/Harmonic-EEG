name: Notebook check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - name: Run the notebook without the raw EEG (the cleaning demo is skipped)
        run: uv run --locked jupyter nbconvert --to notebook --execute ms2_data.ipynb --output executed.ipynb --output-dir .validation --ExecutePreprocessor.timeout=180
